<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Quest Generátor</title>

  <!-- Ikona v záložce prohlížeče, na ploše telefonu (iPhone) a nastavení appky pro Android -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Fonty z Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">

  <style>
    /* ===== Barvy (měníš je na jednom místě) ===== */
    :root {
      --wine: #772C3A;
      --cream: #F4E5A7;
      --brown: #35211F;
      --pink: #E8C5C3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--cream);
      color: var(--brown);
      font-family: 'Montserrat', sans-serif;
    }

    .app {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 7vw, 3rem);
      color: var(--wine);
      margin: 0 0 8px;
    }

    .subtitle {
      margin: 0 0 32px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ===== Tlačítka úrovní ===== */
    .levels {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .level-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .level {
      padding: 12px 8px;
      border: 2px solid var(--wine);
      border-radius: 999px;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    /* Barvy při najetí myší jen na zařízeních s myší (na iPhonu by po klepnutí zůstaly "viset") */
    @media (hover: hover) {
      .level:hover { background: var(--pink); }
    }

    .level.active {
      background: var(--wine);
      color: var(--cream);
    }

    /* Pokrok pod každou úrovní ("Splněno 3/10") */
    .progress {
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* ===== Tlačítko "Filtry" a štítky zapnutých filtrů ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filters-open {
      min-height: 44px;
      padding: 8px 22px;
      border: 2px solid var(--wine);
      border-radius: 999px;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    @media (hover: hover) {
      .filters-open:hover {
        background: var(--wine);
        color: var(--cream);
      }
    }

    /* Štítek zapnutého filtru, např. "Odvaha 💪 ✕" – klepnutí kamkoli na něj filtr zruší */
    .filter-tag {
      min-height: 36px;
      padding: 6px 12px;
      border: 1.5px solid var(--wine);
      border-radius: 999px;
      background: var(--pink);
      color: var(--wine);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-tag-x {
      margin-left: 4px;
      opacity: 0.7;
    }

    @media (hover: hover) {
      .filter-tag:hover .filter-tag-x { opacity: 1; }
    }

    /* ===== Možnosti filtrů v okně "Filtry" ===== */
    .filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category {
      min-height: 40px;
      padding: 6px 14px;
      border: 1.5px solid var(--wine);
      border-radius: 999px;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    @media (hover: hover) {
      .category:hover { background: rgba(232, 197, 195, 0.6); }
    }

    .category.active {
      background: var(--pink);
      font-weight: 600;
    }

    /* ===== Hlavní tlačítko ===== */
    .generate {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: var(--brown);
      color: var(--cream);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(53, 33, 31, 0.25);
      transition: transform 0.15s, background 0.2s;
    }

    @media (hover: hover) {
      .generate:hover { background: var(--wine); }
    }
    .generate:active { transform: scale(0.98); }

    /* ===== Karta s questem ===== */
    .card {
      margin-top: 28px;
      padding: 32px 24px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--pink);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(119, 44, 58, 0.15);
    }

    .card-level {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--wine);
      margin-bottom: 12px;
    }

    /* Štítky kategorie a budgetu na kartě, např. "Me time 💄" "Zdarma 🆓" */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .card-tag {
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--wine);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .quest {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      line-height: 1.35;
      margin: 0;
    }

    .placeholder {
      font-style: italic;
      opacity: 0.7;
    }

    [hidden] { display: none !important; }

    /* ===== Tlačítka pod questem ("Hotovo ✓" a "Zpět") ===== */
    .card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .done {
      margin-top: 20px;
      padding: 8px 20px;
      border: 2px solid var(--wine);
      border-radius: 999px;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    @media (hover: hover) {
      .done:hover:not(:disabled) {
        background: var(--wine);
        color: var(--cream);
      }
    }

    .done:disabled {
      border-color: transparent;
      cursor: default;
    }

    /* Nenápadné "Zpět" vedle "Splněno 🎉" */
    .undo {
      margin-top: 20px;
      padding: 8px 4px;
      border: none;
      background: none;
      color: var(--brown);
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: underline;
      opacity: 0.8;
      cursor: pointer;
    }

    @media (hover: hover) {
      .undo:hover { opacity: 1; }
    }

    /* ===== Tlačítko "Můj deník 📖" ===== */
    .journal-open {
      display: block;
      margin: 24px auto 0;
      padding: 8px 20px;
      border: 2px solid var(--wine);
      border-radius: 999px;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    @media (hover: hover) {
      .journal-open:hover {
        background: var(--wine);
        color: var(--cream);
      }
    }

    /* ===== Okno deníku ===== */
    .journal {
      width: min(560px, calc(100% - 32px));
      max-height: calc(100% - 48px);
      overflow-y: auto;
      padding: 0;
      border: none;
      border-radius: 20px;
      background: var(--cream);
      color: var(--brown);
      box-shadow: 0 12px 40px rgba(53, 33, 31, 0.35);
    }

    .journal::backdrop { background: rgba(53, 33, 31, 0.55); }

    /* Když je deník otevřený, stránka pod ním se neposouvá */
    body:has(.journal[open]) { overflow: hidden; }

    .journal-inner { padding: 0 24px 24px; }

    .journal-header {
      position: sticky;
      top: 0;
      z-index: 1;  /* vždy nad posouvaným seznamem (i nad průhlednými daty) */
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 0 8px;
      background: var(--cream);
    }

    .journal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--wine);
      margin: 0;
    }

    /* Po otevření deníku je zaměřený nadpis (ne tlačítko "Zavřít"), bez rámečku */
    .journal h2:focus { outline: none; }

    .journal-close {
      padding: 8px 4px;
      border: none;
      background: none;
      color: var(--brown);
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: underline;
      opacity: 0.8;
      cursor: pointer;
    }

    @media (hover: hover) {
      .journal-close:hover { opacity: 1; }
    }

    .journal h3 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--wine);
      margin: 20px 0 10px;
    }

    .journal ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .journal li {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--pink);
    }

    .journal-quest {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      line-height: 1.35;
    }

    .journal-date {
      display: block;
      margin-top: 4px;
      font-size: 0.75rem;
      opacity: 0.75;
    }

    .journal-empty {
      margin: 0;
      font-size: 0.85rem;
      font-style: italic;
      opacity: 0.7;
    }

    .journal-empty-all { margin: 12px 0 0; }

    /* ===== Okno "Filtry" (vzhled přebírá od okna deníku) ===== */
    .filters { width: min(480px, calc(100% - 32px)); }

    /* Kulaté ✕ v rohu okna */
    .icon-close {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 1.3rem;
      cursor: pointer;
    }

    @media (hover: hover) {
      .icon-close:hover { background: var(--pink); }
    }

    .filters h3 { margin-top: 16px; }

    .filters-reset {
      display: block;
      margin: 28px auto 4px;
      min-height: 44px;
      padding: 8px 22px;
      border: 2px solid var(--wine);
      border-radius: 999px;
      background: transparent;
      color: var(--wine);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }

    @media (hover: hover) {
      .filters-reset:hover:not(:disabled) {
        background: var(--wine);
        color: var(--cream);
      }
    }

    /* Když není co rušit, tlačítko je vybledlé */
    .filters-reset:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ===== Nenápadný odkaz "Začít znovu" ===== */
    .reset {
      margin-top: 28px;
      padding: 4px;
      border: none;
      background: none;
      color: var(--brown);
      font-family: inherit;
      font-size: 0.8rem;
      text-decoration: underline;
      opacity: 0.7;
      cursor: pointer;
    }

    @media (hover: hover) {
      .reset:hover { opacity: 1; }
    }

    /* ===== Patička s odkazem na Instagram ===== */
    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      line-height: 1.6;
      opacity: 0.8;
    }

    .footer a {
      color: var(--wine);
      font-weight: 600;
    }

    /* Jemné objevení nového questu */
    .fade-in { animation: fadeIn 0.5s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Úzké obrazovky (mobil) */
    @media (max-width: 420px) {
      .level { font-size: 0.85rem; padding: 10px 4px; }
      .journal { width: calc(100% - 24px); max-height: calc(100% - 24px); }
      .journal-inner { padding: 0 16px 16px; }
      .category { min-height: 44px; }
      .filter-tag { min-height: 40px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Side Quest Generátor</h1>
    <p class="subtitle">Malé výzvy pro velký den. Vyber si úroveň a nech se překvapit.</p>

    <div class="label">Vyber úroveň</div>
    <div class="levels">
      <div class="level-item">
        <button class="level active" data-level="easy">Lehká</button>
        <span class="progress" data-progress="easy"></span>
      </div>
      <div class="level-item">
        <button class="level" data-level="medium">Střední</button>
        <span class="progress" data-progress="medium"></span>
      </div>
      <div class="level-item">
        <button class="level" data-level="hard">Těžká</button>
        <span class="progress" data-progress="hard"></span>
      </div>
    </div>

    <!-- Tlačítko "Filtry" + štítky zapnutých filtrů (doplní je skript) -->
    <div class="filter-bar" id="filter-bar">
      <button class="filters-open" id="filters-open">Filtry</button>
    </div>

    <button class="generate" id="generate">Dej mi side quest ✨</button>

    <div class="card" id="card">
      <div class="card-level" id="card-level"></div>
      <div class="card-tags" id="card-tags" hidden>
        <span class="card-tag" id="card-category"></span>
        <span class="card-tag" id="card-budget"></span>
      </div>
      <p class="quest placeholder" id="quest">Tvůj side quest se objeví tady.</p>
      <div class="card-actions">
        <button class="done" id="done" hidden>Hotovo ✓</button>
        <button class="undo" id="undo" hidden>Zpět</button>
      </div>
    </div>

    <button class="journal-open" id="journal-open">Můj deník 📖</button>

    <button class="reset" id="reset">Začít znovu</button>

    <footer class="footer">
      Vytvořeno v rámci 90hodinové challenge ·
      <a href="https://www.instagram.com/after_hours_project_/" target="_blank" rel="noopener">@after_hours_project_</a>
    </footer>
  </main>

  <!-- Deník: okno se splněnými questy (jen na prohlížení) -->
  <dialog class="journal" id="journal" aria-labelledby="journal-title">
    <div class="journal-inner">
      <div class="journal-header">
        <h2 id="journal-title" tabindex="-1" autofocus>Můj deník 📖</h2>
        <button class="journal-close" id="journal-close">Zavřít ✕</button>
      </div>
      <p class="journal-empty journal-empty-all" id="journal-empty" hidden>Tvůj deník je zatím prázdný. První side quest čeká! ✨</p>
      <div id="journal-list"></div>
    </div>
  </dialog>

  <!-- Okno "Filtry": kategorie a budget (možnosti doplní skript) -->
  <dialog class="journal filters" id="filters" aria-labelledby="filters-title">
    <div class="journal-inner">
      <div class="journal-header">
        <h2 id="filters-title" tabindex="-1" autofocus>Filtry</h2>
        <button class="icon-close" id="filters-close" aria-label="Zavřít">✕</button>
      </div>
      <h3>Kategorie</h3>
      <div class="filter-options" id="category-options"></div>
      <h3>Budget</h3>
      <div class="filter-options" id="budget-options"></div>
      <button class="filters-reset" id="filters-reset" disabled>Zrušit filtry</button>
    </div>
  </dialog>

  <script>
    // ===== Supabase: odtud se načítají questy =====
    // Veřejný (publishable) klíč smí být vidět – databáze mu dovolí questy jen číst.
    // Tajný (secret) klíč sem NIKDY nepatří.
    const SUPABASE_URL = "https://rrcclzjcbupgshdsskgm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_H2RVY0ok7YHztB0DcaAeIw_jQpn5DwT";

    // Kategorie: krátký kód (stejný jako sloupec "category" v databázi) → název na tlačítku a štítku.
    // Nová kategorie = nový řádek tady, tlačítko filtru se přidá samo.
    const CATEGORIES = {
      odvaha: "Odvaha 💪",
      dobrodruzstvi: "Dobrodružství 🗺️",
      komunita: "Komunita 💬",
      metime: "Me time 💄",
      kreativita: "Kreativita 🎨",
      vzdelavani: "Vzdělávání 🎓"
    };

    // Budget: kód (stejný jako sloupec "budget" v databázi) → název na tlačítku a štítku.
    const BUDGETS = {
      zdarma: "Zdarma 🆓",
      do500: "Do 500 Kč 💸",
      vicnez500: "Víc než 500 Kč 💰"
    };

    // Questy po úrovních: { easy: [{ id, category, budget, text }, ...], medium: [...], hard: [...] }
    // Dokud se nenačtou ze Supabase, je to undefined.
    let QUESTS;
    let questsStatus = "loading";   // "loading" = načítá se, "ready" = hotovo, "error" = nepovedlo se

    const loadingText = "Načítám questy… ✨";
    const loadErrorText = "Questy se teď nepodařilo načíst 😕 Zkontroluj připojení k internetu a klikni na „Dej mi side quest ✨“ – zkusím to znovu.";

    const levelNames = { easy: "Lehká", medium: "Střední", hard: "Těžká" };

    // Zpráva, když je celá úroveň splněná
    const levelDoneMessages = {
      easy: "🎉 Všechny lehké questy splněny! Rozjezd máš za sebou, zkus střední úroveň.",
      medium: "🌟 Střední úroveň pokořena! Jsi odvážnější, než si myslíš.",
      hard: "👑 Všechny těžké questy hotové! Oficiálně jsi the main character svého života."
    };

    // Pod tímto názvem si prohlížeč (localStorage) pamatuje splněné questy.
    // Formát: [{ "id": "easy-003", "date": "2026-11-06" }, ...]
    // "date" je null u questů splněných dřív, než appka začala ukládat data.
    const STORAGE_KEY = "sideQuestDone";

    let currentLevel = "easy";      // na začátku je vybraná lehká úroveň
    let currentCategory = "all";    // filtr kategorie, na začátku "Všechny" (nepamatuje se)
    let currentBudget = "all";      // filtr budgetu, na začátku "Všechny" (nepamatuje se)
    let lastQuestId = "";           // pamatujeme si ID posledního questu, ať se hned neopakuje
    let currentQuest = null;        // quest, který je právě vidět na kartě
    let lastDone = null;            // quest, u kterého jde ještě kliknout na "Zpět"
    let doneEntries = loadDone();   // splněné questy s datem, viz formát výše
    saveDone();                     // starý formát se hned uloží v novém

    const levelButtons = document.querySelectorAll(".level");
    const questText = document.getElementById("quest");
    const cardLevel = document.getElementById("card-level");
    const cardTags = document.getElementById("card-tags");
    const cardCategory = document.getElementById("card-category");
    const cardBudget = document.getElementById("card-budget");
    const card = document.getElementById("card");
    const doneButton = document.getElementById("done");
    const undoButton = document.getElementById("undo");
    const placeholderText = questText.textContent;

    // Načte splněné questy z prohlížeče (když nic není nebo je to rozbité, začne s prázdným seznamem).
    // Starý formát (jen ID, např. "easy-003") převede na { id, date: null }, nic se neztratí.
    function loadDone() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(saved)) return [];
        const seen = new Set();
        return saved
          .map(item => typeof item === "string" ? { id: item, date: null } : item)
          .filter(item => item && typeof item.id === "string" && !seen.has(item.id) && seen.add(item.id))
          .map(item => ({ id: item.id, date: typeof item.date === "string" ? item.date : null }));
      } catch (e) {
        return [];
      }
    }

    // Uloží splněné questy do prohlížeče (když to prohlížeč nedovolí, appka funguje dál, jen si nic nepamatuje)
    function saveDone() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(doneEntries));
      } catch (e) {}
    }

    // Je quest s tímto ID splněný?
    function isDone(id) {
      return doneEntries.some(entry => entry.id === id);
    }

    // Dnešní datum podle místního času, např. "2026-11-06"
    function todayString() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    // "2026-11-06" → "6. 11. 2026"
    function formatDate(date) {
      const [year, month, day] = date.split("-");
      return Number(day) + ". " + Number(month) + ". " + year;
    }

    // Questy z dané úrovně, které ještě nejsou splněné
    function remainingQuests(level) {
      return QUESTS[level].filter(q => !isDone(q.id));
    }

    // Přepíše "Splněno 3/10" pod každou úrovní
    function updateProgress() {
      if (typeof QUESTS === "undefined") return;
      document.querySelectorAll(".progress").forEach(el => {
        const list = QUESTS[el.dataset.progress];
        const count = list.length - remainingQuests(el.dataset.progress).length;
        el.textContent = "Splněno " + count + "/" + list.length;
      });
    }

    // Název kategorie podle kódu, např. "metime" → "Me time 💄" (neznámý kód → prázdný text)
    function categoryName(code) {
      return CATEGORIES[code] || "";
    }

    // Název budgetu podle kódu, např. "zdarma" → "Zdarma 🆓" (neznámý kód → prázdný text)
    function budgetName(code) {
      return BUDGETS[code] || "";
    }

    // Ukáže text na kartě s jemnou animací (štítky kategorie a budgetu jen u skutečného questu)
    function showOnCard(levelText, text, category, budget) {
      cardLevel.textContent = levelText;
      cardCategory.textContent = categoryName(category);
      cardCategory.hidden = !cardCategory.textContent;
      cardBudget.textContent = budgetName(budget);
      cardBudget.hidden = !cardBudget.textContent;
      cardTags.hidden = cardCategory.hidden && cardBudget.hidden;
      questText.textContent = text;
      questText.classList.remove("placeholder");

      // Restart animace, aby se každý nový quest jemně objevil
      card.classList.remove("fade-in");
      void card.offsetWidth;
      card.classList.add("fade-in");
    }

    // Oslavná zpráva za splněnou úroveň ("Zpět" zůstane, pokud jde poslední quest vrátit)
    function showLevelDone(level) {
      currentQuest = null;
      doneButton.hidden = true;
      undoButton.hidden = !lastDone;
      showOnCard(levelNames[level] + " úroveň", levelDoneMessages[level]);
    }

    // Odpovídá quest zapnutým filtrům (kategorie + budget)?
    function matchesFilters(quest) {
      return (currentCategory === "all" || quest.category === currentCategory)
          && (currentBudget === "all" || quest.budget === currentBudget);
    }

    // Názvy zapnutých filtrů pro zprávu, např. "Odvaha 💪 · Zdarma 🆓"
    function activeFilterNames() {
      const names = [];
      if (currentCategory !== "all") names.push(categoryName(currentCategory));
      if (currentBudget !== "all") names.push(budgetName(currentBudget));
      return names.join(" · ");
    }

    // Zpráva, když filtrům v této úrovni neodpovídá žádný nesplněný quest
    function showFilterEmpty(level) {
      currentQuest = null;
      doneButton.hidden = true;
      const names = activeFilterNames();
      const exists = QUESTS[level].some(matchesFilters);
      showOnCard(levelNames[level] + " úroveň", exists
        ? "Všechny questy pro filtry " + names + " máš v této úrovni splněné! 🎉 Zkus odebrat některý filtr."
        : "Pro filtry " + names + " tu v této úrovni zatím žádný quest není. Zkus odebrat některý filtr ✨");
    }

    // Vrátí kartu do výchozího stavu ("Tvůj side quest se objeví tady.",
    // nebo zprávu o načítání / chybě, dokud questy nejsou načtené)
    function clearCard() {
      currentQuest = null;
      lastDone = null;
      doneButton.hidden = true;
      undoButton.hidden = true;
      cardTags.hidden = true;
      cardLevel.textContent = "";
      questText.textContent =
        questsStatus === "ready" ? placeholderText :
        questsStatus === "loading" ? loadingText : loadErrorText;
      questText.classList.add("placeholder");
    }

    // Načte questy ze Supabase (jen čtení). Když to nevyjde do 10 sekund nebo vůbec,
    // ukáže přátelskou zprávu. Splněné questy v prohlížeči se tím nikdy nemění.
    async function loadQuests() {
      questsStatus = "loading";
      clearCard();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(
          SUPABASE_URL + "/rest/v1/quests?select=id,level,category,budget,text&order=id",
          { headers: { apikey: SUPABASE_KEY }, signal: controller.signal }
        );
        if (!response.ok) throw new Error("Supabase odpověděl " + response.status);
        const rows = await response.json();
        if (!Array.isArray(rows) || rows.length === 0) throw new Error("Žádné questy");

        // Roztřídíme řádky z databáze do stejného tvaru, jaký měl dřív quests.js
        const loaded = { easy: [], medium: [], hard: [] };
        rows.forEach(row => {
          if (loaded[row.level]) loaded[row.level].push({ id: row.id, category: row.category, budget: row.budget, text: row.text });
        });
        QUESTS = loaded;
        questsStatus = "ready";
        updateProgress();
      } catch (e) {
        questsStatus = "error";
      } finally {
        clearTimeout(timer);
      }
      clearCard();
    }

    // Kliknutí na úroveň: označí ji jako vybranou a vyčistí kartu
    levelButtons.forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.level === currentLevel) return;  // stejná úroveň: nic neměníme
        levelButtons.forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        currentLevel = button.dataset.level;
        clearCard();
      });
    });

    // ===== Filtry (okno "Filtry" + štítky na hlavní obrazovce) =====
    const filtersDialog = document.getElementById("filters");
    const filterBar = document.getElementById("filter-bar");
    const filtersResetButton = document.getElementById("filters-reset");

    // Dvě sekce filtrů. Každá ví, odkud bere možnosti a kde je uložená vybraná hodnota.
    const filterSections = {
      category: {
        names: CATEGORIES,
        box: document.getElementById("category-options"),
        get: () => currentCategory,
        set: code => { currentCategory = code; }
      },
      budget: {
        names: BUDGETS,
        box: document.getElementById("budget-options"),
        get: () => currentBudget,
        set: code => { currentBudget = code; }
      }
    };

    // Nastaví filtr jedné sekce ("all" = Všechny). Stejná hodnota: nic se nemění.
    function setFilter(section, code) {
      const s = filterSections[section];
      if (s.get() === code) return;
      s.set(code);
      renderFilters();
      clearCard();
    }

    // Překreslí vybrané možnosti v okně, štítky na hlavní obrazovce a tlačítko "Zrušit filtry"
    function renderFilters() {
      Object.values(filterSections).forEach(s => {
        s.box.querySelectorAll(".category").forEach(b => b.classList.toggle("active", b.dataset.code === s.get()));
      });

      filterBar.querySelectorAll(".filter-tag").forEach(tag => tag.remove());
      Object.entries(filterSections).forEach(([section, s]) => {
        if (s.get() === "all") return;
        const tag = document.createElement("button");
        tag.className = "filter-tag";
        tag.setAttribute("aria-label", "Zrušit filtr " + s.names[s.get()]);
        tag.textContent = s.names[s.get()];
        const x = document.createElement("span");
        x.className = "filter-tag-x";
        x.textContent = "✕";
        tag.appendChild(x);
        tag.addEventListener("click", () => setFilter(section, "all"));
        filterBar.appendChild(tag);
      });

      filtersResetButton.disabled = currentCategory === "all" && currentBudget === "all";
    }

    // Tlačítka možností: "Všechny" + všechno ze seznamu (CATEGORIES nebo BUDGETS)
    Object.entries(filterSections).forEach(([section, s]) => {
      ["all"].concat(Object.keys(s.names)).forEach(code => {
        const button = document.createElement("button");
        button.className = "category";
        button.dataset.code = code;
        button.textContent = code === "all" ? "Všechny" : s.names[code];
        button.addEventListener("click", () => setFilter(section, code));
        s.box.appendChild(button);
      });
    });

    // "Zrušit filtry": obě sekce zpátky na "Všechny"
    filtersResetButton.addEventListener("click", () => {
      if (currentCategory === "all" && currentBudget === "all") return;
      currentCategory = "all";
      currentBudget = "all";
      renderFilters();
      clearCard();
    });

    // Otevření a zavření okna (zavře i ✕, klávesa Esc nebo klepnutí vedle okna)
    document.getElementById("filters-open").addEventListener("click", () => {
      filtersDialog.showModal();
      filtersDialog.scrollTop = 0;
    });
    document.getElementById("filters-close").addEventListener("click", () => filtersDialog.close());
    filtersDialog.addEventListener("click", e => {
      if (e.target === filtersDialog) filtersDialog.close();
    });

    renderFilters();

    // Kliknutí na hlavní tlačítko: vybere náhodný nesplněný quest
    document.getElementById("generate").addEventListener("click", () => {
      // Questy ještě nejsou načtené: když se právě načítají, počkáme; po chybě to zkusíme znovu
      if (questsStatus !== "ready") {
        if (questsStatus === "error") loadQuests();
        return;
      }

      // Nový quest = předchozí "Hotovo" už nejde vrátit
      lastDone = null;
      undoButton.hidden = true;

      // 1. Celá úroveň splněná → oslava
      const remaining = remainingQuests(currentLevel);
      if (remaining.length === 0) {
        showLevelDone(currentLevel);
        return;
      }

      // 2. Zapnutým filtrům nic nesplněného neodpovídá → přátelská zpráva
      const list = remaining.filter(matchesFilters);
      if (list.length === 0) {
        showFilterEmpty(currentLevel);
        return;
      }

      // 3. Jinak náhodný quest
      let quest;
      do {
        quest = list[Math.floor(Math.random() * list.length)];
      } while (list.length > 1 && quest.id === lastQuestId);
      lastQuestId = quest.id;
      currentQuest = { level: currentLevel, id: quest.id, text: quest.text, category: quest.category, budget: quest.budget };

      doneButton.textContent = "Hotovo ✓";
      doneButton.disabled = false;
      doneButton.hidden = false;
      showOnCard(levelNames[currentLevel] + " úroveň", quest.text, quest.category, quest.budget);
    });

    // Kliknutí na "Hotovo ✓": uloží ID questu jako splněné
    doneButton.addEventListener("click", () => {
      if (!currentQuest) return;
      const quest = currentQuest;

      if (!isDone(quest.id)) {
        doneEntries.push({ id: quest.id, date: todayString() });
        saveDone();
      }
      updateProgress();
      doneButton.textContent = "Splněno 🎉";
      doneButton.disabled = true;
      lastDone = quest;
      undoButton.hidden = false;

      // Byl to poslední quest úrovně? Chvilku ukážeme "Splněno", pak oslavu
      if (remainingQuests(quest.level).length === 0) {
        setTimeout(() => {
          if (currentQuest === quest && isDone(quest.id)) showLevelDone(quest.level);
        }, 1200);
      }
    });

    // Kliknutí na "Zpět": odebere ID questu ze splněných a vrátí ho na kartu
    undoButton.addEventListener("click", () => {
      if (!lastDone) return;
      const quest = lastDone;

      doneEntries = doneEntries.filter(entry => entry.id !== quest.id);
      saveDone();
      updateProgress();

      lastDone = null;
      currentQuest = quest;
      undoButton.hidden = true;
      doneButton.textContent = "Hotovo ✓";
      doneButton.disabled = false;
      doneButton.hidden = false;
      showOnCard(levelNames[quest.level] + " úroveň", quest.text, quest.category, quest.budget);
    });

    // "Začít znovu": po potvrzení smaže všechny splněné questy
    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("Opravdu chceš smazat všechny splněné questy a začít znovu?")) return;

      doneEntries = [];
      saveDone();
      updateProgress();

      lastQuestId = "";
      clearCard();
    });

    // ===== Deník =====
    const journal = document.getElementById("journal");
    const journalList = document.getElementById("journal-list");
    const journalEmpty = document.getElementById("journal-empty");

    // Postaví seznam splněných questů po úrovních (nejnovější nahoře, bez data na konci)
    function renderJournal() {
      journalList.innerHTML = "";
      if (questsStatus !== "ready") {
        journalEmpty.hidden = true;
        const message = document.createElement("p");
        message.className = "journal-empty journal-empty-all";
        message.textContent = questsStatus === "loading"
          ? "Načítám questy… ✨ Za chvilku to zkus znovu."
          : "Deník se ukáže, až se načtou questy 😕 Zkontroluj připojení k internetu a zkus to znovu.";
        journalList.appendChild(message);
        return;
      }

      let total = 0;
      Object.keys(levelNames).forEach(level => {
        const items = doneEntries
          .map((entry, order) => ({ ...entry, order, quest: QUESTS[level].find(q => q.id === entry.id) }))
          .filter(item => item.quest)
          .sort((a, b) => {
            if (a.date !== b.date) {
              if (!a.date) return 1;
              if (!b.date) return -1;
              return a.date < b.date ? 1 : -1;
            }
            return b.order - a.order;  // stejný den: později splněný je výš
          });
        total += items.length;

        const heading = document.createElement("h3");
        heading.textContent = levelNames[level] + " · " + items.length + "/" + QUESTS[level].length;
        journalList.appendChild(heading);

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "journal-empty";
          empty.textContent = "Zatím tu nic není.";
          journalList.appendChild(empty);
          return;
        }

        const list = document.createElement("ul");
        items.forEach(item => {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.className = "journal-quest";
          text.textContent = item.quest.text;
          li.appendChild(text);
          if (item.date) {
            const date = document.createElement("span");
            date.className = "journal-date";
            date.textContent = formatDate(item.date);
            li.appendChild(date);
          }
          list.appendChild(li);
        });
        journalList.appendChild(list);
      });

      journalEmpty.hidden = total > 0;
    }

    // Otevření a zavření deníku (zavře i klávesa Esc nebo klepnutí vedle okna)
    document.getElementById("journal-open").addEventListener("click", () => {
      renderJournal();
      journal.showModal();
      journal.scrollTop = 0;
    });
    document.getElementById("journal-close").addEventListener("click", () => journal.close());
    journal.addEventListener("click", e => {
      if (e.target === journal) journal.close();
    });

    // Hned po otevření stránky načteme questy ze Supabase
    loadQuests();
  </script>
</body>
</html>
